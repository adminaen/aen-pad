<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>entrar</title>
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png" />
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f4;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #16161a; }
      .card { background: #1f1f24 !important; color: #eee !important; }
      input { background: #101012 !important; color: #eee !important; border-color: #3a3a40 !important; }
    }
    .card {
      background: #fff;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,.08);
      width: min(320px, 90vw);
    }
    h1 { font-size: 1.1rem; margin: 0 0 1rem; }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: .6rem .7rem;
      font-size: 1rem;
      border-radius: 8px;
      border: 1px solid #ccc;
      margin-bottom: .75rem;
    }
    button {
      width: 100%;
      padding: .6rem;
      font-size: 1rem;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: #fff;
      cursor: pointer;
    }
    button:hover { background: #1d4ed8; }
    .error { color: #dc2626; font-size: .85rem; margin: -.5rem 0 .75rem; }
  </style>
</head>
<body>
  <form class="card" method="post" action="/login">
    <h1>AEN Pad</h1>
    <div id="error" class="error" hidden>senha incorreta.</div>
    <input type="hidden" name="next" id="next" value="/" />
    <input type="password" name="password" placeholder="senha" autofocus required />
    <button type="submit">entrar</button>
  </form>
  <script>
    var params = new URLSearchParams(location.search);
    if (params.get('error')) document.getElementById('error').hidden = false;
    var next = params.get('next');
    if (next) document.getElementById('next').value = next;
  </script>
</body>
</html>
