services:
  aen-pad:
    build: .
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      PORT: 3000
      APP_PASSWORD: ${APP_PASSWORD:?defina APP_PASSWORD no .env}
      APP_SECRET: ${APP_SECRET:?defina APP_SECRET no .env}
      DATA_DIR: /data
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
      BACKUP_DIR: /backups
    volumes:
      - aen-pad-data:/data
      - ./backups:/backups
    restart: unless-stopped

volumes:
  aen-pad-data:
